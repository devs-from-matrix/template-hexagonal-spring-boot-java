version: 2
updates:
  # This is for the example directory, which is where the Maven project is located.
  - package-ecosystem: maven
    directory: "/example"
    schedule:
      interval: daily
      time: "23:30"
    open-pull-requests-limit: 10
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "build: "
    assignees:
      - paul58914080
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - ci
      - automated
    commit-message:
      prefix: "ci: "
    assignees:
      - paul58914080